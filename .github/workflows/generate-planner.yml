name: Generate Notes-First Digital Planner

on:
  workflow_dispatch:
    inputs:
      year:
        description: "請輸入要生成的年份 (例如 2026, 2027)"
        required: true
        default: "2026"
        type: string
      include_annual:
        description: "包含「年計畫」"
        required: true
        default: true
        type: boolean
      include_month:
        description: "包含「月計畫」"
        required: true
        default: true
        type: boolean
      include_week:
        description: "包含「週計畫」"
        required: true
        default: true
        type: boolean
      include_day:
        description: "包含「日計畫 (大留白筆記版)」"
        required: true
        default: true
        type: boolean

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案原始碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安裝 ReportLab
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: 執行 Python 生成 PDF 手帳
        run: |
          python generate.py \
            --year "${{ inputs.year }}" \
            --annual "${{ inputs.include_annual }}" \
            --month "${{ inputs.include_month }}" \
            --week "${{ inputs.include_week }}" \
            --day "${{ inputs.include_day }}" \
            --output "Custom_Planner_${{ inputs.year }}.pdf"

      - name: 檢查 PDF 是否成功生成
        run: |
          ls -lh "Custom_Planner_${{ inputs.year }}.pdf"
          file "Custom_Planner_${{ inputs.year }}.pdf"

      - name: 上傳 PDF 供下載
        uses: actions/upload-artifact@v4
        with:
          name: "Planner-${{ inputs.year }}"
          path: "Custom_Planner_${{ inputs.year }}.pdf"
          if-no-files-found: error
